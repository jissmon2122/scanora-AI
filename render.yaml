# Render Deployment Configuration for Scanora AI Inference Microservice
#
# Memory Architecture Notes:
# - Baseline Python + FastAPI + Uvicorn: ~42 MiB
# - Base PyTorch runtime (CPU): ~207 MiB
# - Lazy MammographyClassifier (EfficientNet-B2): +42 MiB (Total ~379 MiB under load) -> Fits within 512 MiB limit.
# - MammographyLesionDetector (Faster R-CNN ResNet-50-FPN): +205 MiB (Total ~584 MiB) -> Requires >= 1 GiB plan if enabled.
# Lazy model loading ensures server boots and passes health checks in < 2ms without exceeding 512 MiB.

services:
  - type: web
    name: scanora-ai
    runtime: python
    region: oregon
    plan: standard
    buildCommand: poetry install --no-root
    startCommand: poetry run python -m uvicorn ai_service.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SCANORA_AI_API_KEY
        value: scanora-research-token-secure-2026
      - key: SCANORA_CHECKPOINTS_DIR
        value: ./ai_service/checkpoints
      - key: PYTHONPATH
        value: .
      - key: FORCE_CPU
        value: "true"
